<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧櫃台叫號系統</title>
    <!-- Tailwind CSS -->

            background: #475569;

<body class="h-full flex flex-col overflow-x-hidden selection:bg-indigo-500 selection:text-white">

    <!-- Top Navigation Bar -->

            </div>
            <div>

                    <div class="flex items-center justify-between z-10">

    <!-- ==================== SCRIPT ==================== -->
    <script>
        const CORRECT_PASSWORD = '20190309';
        const STORAGE_KEY = 'smart_queue_system_v3';
        const channel = new BroadcastChannel('smart_queue_channel_v3');

        let state = {
            counters: [
                { id: 'c1', name: '櫃台 A' },
                { id: 'c2', name: '櫃台 B' }
            ],
            activeCounterId: 'c1',
            tickets: [],
            nextTicketNum: 1,
            settings: {
                voiceEnabled: true,
                prefix: 'A'
            },
            filter: 'all',
            counterUnlocked: false
        };

        window.addEventListener('DOMContentLoaded', () => {
            loadState();
            initClock();
            unlockAudio();

            if (state.tickets.length === 0) {
                for (let i = 1; i <= 3; i++) {
                    createTicketInternal();
                }
                saveStateAndBroadcast();
            }

            renderAll();

            // BroadcastChannel synchronization
            channel.onmessage = (event) => {
                if (event.data && event.data.type === 'STATE_UPDATE') {
                    const localUnlocked = state.counterUnlocked;
                    state = event.data.state;
                    state.counterUnlocked = localUnlocked; // preserve session login state
                    renderAll();
                }
            };

            window.addEventListener('storage', (e) => {
                if (e.key === STORAGE_KEY && e.newValue) {
                    try {
                        const parsed = JSON.parse(e.newValue);
                        const localUnlocked = state.counterUnlocked;
                        state = { ...state, ...parsed };
                        state.counterUnlocked = localUnlocked;
                        renderAll();
                    } catch (err) {
                        console.error('Storage parse error:', err);
                    }
                }
            });
        });

        function unlockAudio() {
            const handler = () => {
                if ('speechSynthesis' in window) {
                    try {
                        const utterance = new SpeechSynthesisUtterance('');
                        window.speechSynthesis.speak(utterance);
                    } catch(e) {}
                }
                window.removeEventListener('click', handler);
                window.removeEventListener('touchstart', handler);
                window.removeEventListener('keydown', handler);
            };
            window.addEventListener('click', handler);
            window.addEventListener('touchstart', handler);
            window.addEventListener('keydown', handler);
        }

        function testAudioSpeech() {
            speakCall('櫃台 A', 'A-001', true);
            showToast('已觸發語音測試，請確認音量', 'info');
        }

        function saveStateAndBroadcast() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                channel.postMessage({ type: 'STATE_UPDATE', state: state });
            } catch (e) {
                console.error('Save error:', e);
            }
        }

        function loadState() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    state = { ...state, ...parsed };
                }
            } catch (e) {
                console.error('Load error:', e);
            }
        }

        function initClock() {
            const update = () => {
                const now = new Date();
                const timeStr = now.toLocaleTimeString('zh-TW', { hour12: false });
                const el = document.getElementById('display-current-time');
                if (el) el.textContent = timeStr;
            };
            update();
            setInterval(update, 1000);
        }

        function switchView(viewName) {
            const displayView = document.getElementById('view-display');
            const counterView = document.getElementById('view-counter');
            const btnDisplay = document.getElementById('btn-view-display');
            const btnCounter = document.getElementById('btn-view-counter');

            if (viewName === 'display') {
                displayView.classList.remove('hidden');
                counterView.classList.add('hidden');
                btnDisplay.className = "px-3 sm:px-4 py-1.5 text-xs sm:text-sm font-medium rounded-lg transition-all flex items-center gap-2 bg-indigo-600 text-white shadow";
                btnCounter.className = "px-3 sm:px-4 py-1.5 text-xs sm:text-sm font-medium rounded-lg transition-all flex items-center gap-2 text-slate-400 hover:text-white";
            } else {
                displayView.classList.add('hidden');
                counterView.classList.remove('hidden');
                btnCounter.className = "px-3 sm:px-4 py-1.5 text-xs sm:text-sm font-medium rounded-lg transition-all flex items-center gap-2 bg-indigo-600 text-white shadow";
                btnDisplay.className = "px-3 sm:px-4 py-1.5 text-xs sm:text-sm font-medium rounded-lg transition-all flex items-center gap-2 text-slate-400 hover:text-white";
            }
        }

        function requestSwitchToCounter() {
            if (state.counterUnlocked) {
                switchView('counter');
            } else {
                document.getElementById('counter-password-input').value = '';
                document.getElementById('modal-password').classList.remove('hidden');
            }
        }

        function verifyPassword(e) {
            e.preventDefault();
            const val = document.getElementById('counter-password-input').value;
            if (val === CORRECT_PASSWORD) {
                state.counterUnlocked = true;
                closePasswordModal();
                switchView('counter');
                showToast('密碼正確，已成功登入櫃台操作端', 'success');
            } else {
                showToast('密碼錯誤，請重新輸入（提示: 20190309）', 'warning');
            }
        }

        function closePasswordModal() {
            document.getElementById('modal-password').classList.add('hidden');
        }

        function createTicketInternal() {
            const numStr = String(state.nextTicketNum).padStart(3, '0');
            const fullNum = `${state.settings.prefix}-${numStr}`;
            const ticket = {
                id: 't_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                number: fullNum,
                status: 'waiting',
                counterId: null,
                time: new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' })
            };
            state.tickets.push(ticket);
            state.nextTicketNum++;
            return ticket;
        }

        function takeNewTicket() {
            const newT = createTicketInternal();
            saveStateAndBroadcast();
            renderAll();
            showToast(`已成功取號：${newT.number}`, 'success');
        }

        function changeActiveCounter(id) {
            state.activeCounterId = id;
            saveStateAndBroadcast();
            renderAll();
        }

        function callNextNumber() {
            const waitingTicket = state.tickets.find(t => t.status === 'waiting');
            if (!waitingTicket) {
                showToast('目前沒有等待中的號碼！', 'warning');
                return;
            }

            waitingTicket.status = 'calling';
            waitingTicket.counterId = state.activeCounterId;
            waitingTicket.time = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });

            saveStateAndBroadcast();
            renderAll();

            const cObj = state.counters.find(c => c.id === state.activeCounterId);
            speakCall(cObj ? cObj.name : '櫃台', waitingTicket.number);
            showToast(`正在叫號：${waitingTicket.number}`, 'info');
        }

        function repeatCurrentCall() {
            const current = state.tickets.find(t => t.status === 'calling' && t.counterId === state.activeCounterId) ||
                              state.tickets.filter(t => t.status === 'calling').pop();
            if (!current) {
                showToast('目前沒有正在叫號的號碼可重播', 'warning');
                return;
            }
            const cObj = state.counters.find(c => c.id === current.counterId);
            speakCall(cObj ? cObj.name : '櫃台', current.number);
            showToast(`重播號碼：${current.number}`, 'info');
        }

        function repeatCurrentCallDisplay() {
            const current = state.tickets.filter(t => t.status === 'calling').pop() || state.tickets.filter(t => t.status === 'completed').pop();
            if (!current) {
                showToast('目前沒有可重播的號碼', 'warning');
                return;
            }
            const cObj = state.counters.find(c => c.id === current.counterId);
            speakCall(cObj ? cObj.name : '櫃台', current.number);
            showToast(`重播號碼：${current.number}`, 'info');
        }

        function skipCurrentNumber() {
            const current = state.tickets.find(t => t.status === 'calling' && t.counterId === state.activeCounterId);
            if (!current) {
                showToast('目前沒有正在叫號的號碼可跳過', 'warning');
                return;
            }
            current.status = 'skipped';
            saveStateAndBroadcast();
            renderAll();
            showToast(`號碼 ${current.number} 已設為過號`, 'warning');
        }

        function completeCurrentNumber() {
            const current = state.tickets.find(t => t.status === 'calling' && t.counterId === state.activeCounterId);
            if (!current) {
                showToast('目前沒有正在叫號的號碼可完成', 'warning');
                return;
            }
            current.status = 'completed';
            saveStateAndBroadcast();
            renderAll();
            showToast(`號碼 ${current.number} 已完成服務`, 'success');
        }

        function updateTicketStatus(id, newStatus) {
            const t = state.tickets.find(item => item.id === id);
            if (t) {
                t.status = newStatus;
                if (newStatus === 'calling') t.counterId = state.activeCounterId;
                saveStateAndBroadcast();
                renderAll();
                showToast('狀態已更新', 'info');
            }
        }

        function deleteTicket(id) {
            state.tickets = state.tickets.filter(t => t.id !== id);
            saveStateAndBroadcast();
            renderAll();
            showToast('已刪除號碼', 'info');
        }

        function resetAllData() {
            if (confirm('確定要重置所有排隊資料嗎？')) {
                state.tickets = [];
                state.nextTicketNum = 1;
                saveStateAndBroadcast();
                renderAll();
                showToast('已重置所有資料', 'success');
            }
        }

        function speakCall(counterName, ticketNumber, force = false) {
            if (!force && !state.settings.voiceEnabled) return;
            if (!('speechSynthesis' in window)) return;

            try {
                window.speechSynthesis.cancel();
                const cleanNum = ticketNumber.replace(/-/g, ' ').split('').join(' ');
                const text = `請，${counterName}，${cleanNum} 號`;

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-TW';
                utterance.rate = 0.9;

                const voices = window.speechSynthesis.getVoices();
                const twVoice = voices.find(v => v.lang.includes('zh'));
                if (twVoice) utterance.voice = twVoice;

                window.speechSynthesis.speak(utterance);
            } catch (e) {
                console.error('Speech error:', e);
            }
        }

        function setFilter(status) {
            state.filter = status;
            ['all', 'waiting', 'calling', 'completed', 'skipped'].forEach(s => {
                const btn = document.getElementById(`filter-${s}`);
                if (btn) {
                    btn.className = (s === status)
                        ? "px-3 py-1.5 bg-indigo-600 text-white rounded-lg text-xs font-medium transition shadow"
                        : "px-3 py-1.5 bg-slate-700 text-slate-300 hover:bg-slate-600 rounded-lg text-xs font-medium transition";
                }
            });
            renderQueueTable();
        }

        function renderAll() {
            renderCounters();
            renderDisplayView();
            renderCounterControls();
            renderQueueTable();
        }

        function renderCounters() {
            const sel = document.getElementById('counter-select');
            if (sel) {
                sel.innerHTML = state.counters.map(c => `
                    <option value="${c.id}" ${c.id === state.activeCounterId ? 'selected' : ''}>${c.name}</option>
                `).join('');
            }
        }

        function renderDisplayView() {
            const active = state.tickets.find(t => t.status === 'calling' && t.counterId === state.activeCounterId) ||
                           state.tickets.filter(t => t.status === 'calling').pop() ||
                           state.tickets.filter(t => t.status === 'completed').pop();

            const numEl = document.getElementById('display-active-number');
            const counterEl = document.getElementById('display-active-counter');

            if (active) {
                const cObj = state.counters.find(c => c.id === active.counterId);
                numEl.textContent = active.number;
                counterEl.textContent = cObj ? `${cObj.name} 正在叫號` : '正在叫號';
            } else {
                numEl.textContent = '----';
                counterEl.textContent = '目前尚無叫號';
            }

            const waitingList = state.tickets.filter(t => t.status === 'waiting');
            const badge = document.getElementById('waiting-count-badge');
            if (badge) badge.textContent = `${waitingList.length} 人`;

            const waitingEl = document.getElementById('display-waiting-list');
            if (waitingEl) {
                if (waitingList.length === 0) {
                    waitingEl.innerHTML = `<div class="text-center py-8 text-slate-500 text-xs">目前沒有等待中的號碼</div>`;
                } else {
                    waitingEl.innerHTML = waitingList.map((t, idx) => `
                        <div class="bg-slate-900/60 border border-slate-700/60 rounded-xl p-3 flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <span class="w-6 h-6 rounded-full bg-slate-800 text-slate-400 text-xs font-bold flex items-center justify-center">${idx + 1}</span>
                                <span class="font-bold text-white text-base tracking-wider">${t.number}</span>
                            </div>
                            <span class="text-xs text-slate-400">${t.time}</span>
                        </div>
                    `).join('');
                }
            }

            const historyEl = document.getElementById('display-history-list');
            if (historyEl) {
                const history = [...state.tickets].filter(t => t.status === 'completed' || t.status === 'calling').slice(-4).reverse();
                if (history.length === 0) {
                    historyEl.innerHTML = `<div class="col-span-full bg-slate-900/50 border border-slate-700/50 rounded-xl p-3 text-center text-slate-500 text-xs">尚無歷史紀錄</div>`;
                } else {
                    historyEl.innerHTML = history.map(t => {
                        const cObj = state.counters.find(c => c.id === t.counterId);
                        return `
                            <div class="bg-slate-900/80 border border-slate-700/80 rounded-xl p-3 text-center flex flex-col justify-between">
                                <div class="text-xs text-indigo-400 font-semibold mb-1">${cObj ? cObj.name : '櫃台'}</div>
                                <div class="text-xl font-bold text-white tracking-widest">${t.number}</div>
                                <div class="text-[10px] text-slate-500 mt-1">${t.time}</div>
                            </div>
                        `;
                    }).join('');
                }
            }
        }

        function renderCounterControls() {
            const activeC = state.counters.find(c => c.id === state.activeCounterId);
            const nameEl = document.getElementById('ctrl-counter-name');
            const servingEl = document.getElementById('ctrl-current-serving');

            if (nameEl && activeC) nameEl.textContent = activeC.name;

            const current = state.tickets.find(t => t.status === 'calling' && t.counterId === state.activeCounterId);
            if (servingEl) servingEl.textContent = current ? current.number : '----';
        }

        function renderQueueTable() {
            const tbody = document.getElementById('queue-table-body');
            if (!tbody) return;

            let filtered = state.tickets;
            if (state.filter !== 'all') {
                filtered = state.tickets.filter(t => t.status === state.filter);
            }

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-slate-500 text-xs">沒有符合條件的號碼資料</td></tr>`;
                return;
            }

            const badgeHTML = (status) => {
                switch(status) {
                    case 'waiting': return '<span class="px-2 py-0.5 bg-amber-500/20 text-amber-300 rounded-md text-xs font-medium border border-amber-500/30">等待中</span>';
                    case 'calling': return '<span class="px-2 py-0.5 bg-indigo-500/20 text-indigo-300 rounded-md text-xs font-medium border border-indigo-500/30 animate-pulse">叫號中</span>';
                    case 'completed': return '<span class="px-2 py-0.5 bg-emerald-500/20 text-emerald-300 rounded-md text-xs font-medium border border-emerald-500/30">已完成</span>';
                    case 'skipped': return '<span class="px-2 py-0.5 bg-rose-500/20 text-rose-300 rounded-md text-xs font-medium border border-rose-500/30">已過號</span>';
                    default: return '';
                }
            };

            tbody.innerHTML = filtered.map(t => {
                const cObj = state.counters.find(c => c.id === t.counterId);
                return `
                    <tr class="hover:bg-slate-800/40 transition">
                        <td class="p-3 font-bold text-white">${t.number}</td>
                        <td class="p-3">${badgeHTML(t.status)}</td>
                        <td class="p-3 text-slate-300">${cObj ? cObj.name : '-'}</td>
                        <td class="p-3 text-slate-400 text-xs">${t.time}</td>
                        <td class="p-3 text-right space-x-1">
                            <select onchange="updateTicketStatus('${t.id}', this.value)" class="bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded-lg px-2 py-1 focus:outline-none">
                                <option value="" disabled selected>更改狀態</option>
                                <option value="waiting">等待中</option>
                                <option value="calling">叫號中</option>
                                <option value="completed">已完成</option>
                                <option value="skipped">已過號</option>
                            </select>
                            <button onclick="deleteTicket('${t.id}')" class="p-1.5 text-slate-400 hover:text-rose-400 rounded-lg transition" title="刪除">
                                <i class="fa-solid fa-trash-can text-xs"></i>
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function openSettingsModal() {
            document.getElementById('setting-voice-enabled').checked = state.settings.voiceEnabled;
            document.getElementById('setting-prefix').value = state.settings.prefix;
            renderSettingsCounterList();
            document.getElementById('modal-settings').classList.remove('hidden');
        }

        function closeSettingsModal() {
            document.getElementById('modal-settings').classList.add('hidden');
        }

        function renderSettingsCounterList() {
            const listEl = document.getElementById('settings-counter-list');
            if (!listEl) return;
            listEl.innerHTML = state.counters.map(c => `
                <div class="flex items-center justify-between bg-slate-800 p-2.5 rounded-xl border border-slate-700">
                    <span class="text-sm text-slate-200 font-medium">${c.name}</span>
                    ${state.counters.length > 1 ? `
                        <button onclick="deleteCounter('${c.id}')" class="text-rose-400 hover:text-rose-300 p-1 text-xs">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    ` : '<span class="text-xs text-slate-500">預設</span>'}
                </div>
            `).join('');
        }

        function saveSettings() {
            state.settings.voiceEnabled = document.getElementById('setting-voice-enabled').checked;
            const prefix = document.getElementById('setting-prefix').value.trim();
            if (prefix) state.settings.prefix = prefix.toUpperCase();

            saveStateAndBroadcast();
            closeSettingsModal();
            renderAll();
            showToast('設定已儲存', 'success');
        }

        function openAddCounterModal() {
            document.getElementById('new-counter-name').value = '';
            document.getElementById('modal-add-counter').classList.remove('hidden');
        }

        function closeAddCounterModal() {
            document.getElementById('modal-add-counter').classList.add('hidden');
        }

        function confirmAddCounter() {
            const name = document.getElementById('new-counter-name').value.trim();
            if (!name) {
                showToast('請輸入櫃台名稱', 'warning');
                return;
            }
            const newId = 'c_' + Date.now();
            state.counters.push({ id: newId, name: name });
            saveStateAndBroadcast();
            closeAddCounterModal();
            renderSettingsCounterList();
            renderAll();
            showToast(`已新增櫃台：${name}`, 'success');
        }

        function deleteCounter(id) {
            if (state.counters.length <= 1) {
                showToast('至少需保留一個櫃台', 'warning');
                return;
            }
            state.counters = state.counters.filter(c => c.id !== id);
            if (state.activeCounterId === id) {
                state.activeCounterId = state.counters[0].id;
            }
            saveStateAndBroadcast();
            renderSettingsCounterList();
            renderAll();
            showToast('已刪除櫃台', 'info');
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return;

            const toast = document.createElement('div');
            let borderColor = 'border-indigo-500/40';
            let icon = '<i class="fa-solid fa-circle-info text-indigo-400"></i>';

            if (type === 'success') {
                borderColor = 'border-emerald-500/40';
                icon = '<i class="fa-solid fa-circle-check text-emerald-400"></i>';
            } else if (type === 'warning') {
                borderColor = 'border-amber-500/40';
                icon = '<i class="fa-solid fa-triangle-exclamation text-amber-400"></i>';
            }

            toast.className = `pointer-events-auto bg-slate-900/95 border ${borderColor} text-slate-100 px-4 py-3 rounded-xl shadow-xl flex items-center gap-3 text-xs sm:text-sm animate-in fade-in slide-in-from-bottom-3 duration-200`;
            toast.innerHTML = `${icon}<span>${message}</span>`;

            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'transition-opacity', 'duration-300');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
